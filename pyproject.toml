[project]
name = "python-ise"
version = "0.1.4"
description = "Library to interact with Cisco ISE's ERS and MNT APIs"
readme = "README.md"
authors = [
    { name = "SoloSunset", email = "mathias@mdkp.dk" }
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3.12",
]
keywords = ["cisco", "ise", "ers", "mnt", "sdk"]
urls = { Homepage = "https://github.com/Solosunset/python-ise", Issues = "https://github.com/Solosunset/python-ise/issues", Repository = "https://github.com/Solosunset/python-ise" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.10",
    "furl>=2.1.3",
    "requests>=2.32.3",
    "xmltodict>=0.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "responses>=0.25.3",
    "aioresponses>=0.7.6",
    "PyYAML>=6.0.2",
    "Jinja2>=3.1.5",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/python_ise",
    "README.md",
    "LICENSE",
    "NOTICE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python_ise"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"