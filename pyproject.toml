[project]
name = "python-ise"
version = "0.1.4"
description = "Library to interact with Cisco ISE's three APIs - ERS, MNT and OpenAPI"
readme = "README.md"
authors = [
    { name = "SoloSunset", email = "mathias@mdkp.dk" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.10",
    "furl>=2.1.3",
    "requests>=2.32.3",
    "xmltodict>=0.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "responses>=0.25.3",
    "aioresponses>=0.7.6",
    "PyYAML>=6.0.2",
    "Jinja2>=3.1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python_ise"]

[tool.hatch.build.force-include]
"src/python_ise/manifest/ers.yaml" = "python_ise/manifest/ers.yaml"
"src/python_ise/templates/ers_read.py.j2" = "python_ise/templates/ers_read.py.j2"
"src/python_ise/templates/aliases.py.j2" = "python_ise/templates/aliases.py.j2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"