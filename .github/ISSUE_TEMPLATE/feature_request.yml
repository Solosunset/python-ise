name: Feature request
description: Suggest a non-sensitive improvement to python-ise
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the change without including credentials, real hostnames, real IPs, logs, or customer data.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do that is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: How would you like the library to behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you think about?
